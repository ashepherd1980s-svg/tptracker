h1,h2,h3{font-family:TPD,"Arial Narrow",sans-serif;margin:0;letter-spacing:.2px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:2px solid var(--ink)}
header h1{font-size:26px;flex:1;min-width:200px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ink);background:transparent;padding:7px 12px;border-radius:3px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.stats{display:flex;gap:18px;padding:10px 16px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.stats b{color:var(--ink);font-family:TPD,"Arial Narrow",sans-serif;font-size:20px;margin-right:4px}
.board{display:flex;gap:10px;padding:8px 16px 24px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 235px;background:color-mix(in srgb,var(--card) 55%,transparent);border-top:4px solid var(--accent);border-radius:0 0 3px 3px;min-height:140px}
.col h2{font-size:18px;padding:8px 10px 2px}
.col .sub{font-size:12px;color:var(--mute);padding:0 10px 6px}
.card{display:block;width:calc(100% - 12px);margin:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);padding:8px 10px;border-radius:3px}
.card.hold{border-left-color:var(--hold)}
.card b{font-family:TPD,"Arial Narrow",sans-serif;font-size:18px;display:block}
.card small{color:var(--mute);display:block}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done)}
.tag{display:inline-block;background:var(--hold);color:#fff;font-size:12px;font-weight:600;padding:0 6px;border-radius:2px;margin-top:4px}
.empty{padding:10px;color:var(--mute);font-size:13px}
dialog{border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100% - 30px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:16px}
.dlg h2{font-size:24px}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:7px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.row>*{flex:0 0 auto}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:0 0 auto}
.chk.on span{color:var(--mute);text-decoration:line-through}
.log{font-size:13px;color:var(--mute);margin-top:8px;max-height:130px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px dotted var(--line)}
.steps{display:flex;gap:3px;margin:10px 0 4px}
.steps i{flex:1;height:6px;background:var(--line);border-radius:2px}
.steps i.d{background:var(--done)}.steps i.c{background:var(--accent)}
.danger{color:var(--bad);border-color:var(--bad)}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
[hidden]{display:none!important}
:root{--brand:#a3283c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#e0566e}}
:root[data-theme="dark"]{--brand:#e0566e}
.logo{background:#fff;padding:5px 10px;border-radius:3px;display:block}
.logo.sm{height:38px;width:auto}.logo.lg{width:min(440px,100%);height:auto}
.hero{padding:22px 16px 6px}.hero p{margin:10px 0 0;color:var(--mute);max-width:46ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:14px 16px 28px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--brand);padding:14px;border-radius:3px}
.tile b{font-family:TPD,"Arial Narrow",sans-serif;font-size:23px;display:block;line-height:1.1}
.tile small{display:block;color:var(--mute);margin:4px 0 8px}.tile em{font-style:normal;font-size:13px;color:var(--accent);font-weight:600}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 0}.mh h2{font-size:26px}
.rec{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);padding:10px 12px;margin:8px 16px;border-radius:3px}
.rec.hold{border-left-color:var(--hold)}.rec b{font-family:TPD,"Arial Narrow",sans-serif;font-size:19px;display:block}.rec small{display:block;color:var(--mute)}
.tbar{display:flex;padding:12px 16px 0}
/* phone-first overrides */
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
header{padding:10px 14px;gap:10px;flex-wrap:nowrap}header h1{font-size:22px;min-width:0}.logo.sm{height:34px;cursor:pointer}
button{min-height:44px;padding:8px 14px}
input,select,textarea{font-size:16px;min-height:44px;padding:9px 10px}
.stats{gap:14px;padding:8px 16px}
.board{display:block;padding:0;overflow:visible}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:20px;min-height:40px;padding:6px 14px}.chip b{font-family:TPD,"Arial Narrow",sans-serif;font-size:17px;margin-left:6px}
.chip.on{background:var(--ink);color:var(--bg)}
.cl .card{width:calc(100% - 32px);margin:8px 16px;padding:12px 14px}.card b{font-size:21px}
.tbar{padding:10px 16px 0}.tbar button{width:100%}
.mh button{min-width:120px}.rec{margin:10px 16px}
dialog{width:100%;max-width:100%;margin:auto 0 0;max-height:92vh;border-radius:14px 14px 0 0;border-width:2px 0 0}
.dlg{padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.chk{padding:12px 0}.chk input{width:26px;height:26px;min-height:0}
.row button{flex:1 1 auto}
.more{display:grid;gap:8px;margin-top:12px}
.tiles{grid-template-columns:1fr}
#tab{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
#tab button{flex:1;border:0;border-radius:0;min-height:58px;padding:6px 2px;font-size:14px;font-weight:600;color:var(--mute);background:transparent}
#tab button.on{color:var(--accent);box-shadow:inset 0 4px 0 var(--brand)}
/* polish */
.logo.lg{width:min(300px,72%)}.hero{padding:18px 16px 4px}
.sum{padding:10px 16px 4px}.big{font-family:TPD,"Arial Narrow",sans-serif;font-size:68px;line-height:1;font-weight:700}.big span{font-size:22px;color:var(--mute);font-weight:600}
.prg{height:10px;background:var(--line);border-radius:5px;margin:12px 0 6px;overflow:hidden}.prg i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--done));border-radius:5px}
.sum small{color:var(--mute)}
#attn h2,.sec{padding:14px 16px 0;font-size:21px}
.att{display:block;width:calc(100% - 32px);margin:8px 16px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--hold);background:var(--card)}.att b{display:block;font-size:12px;color:var(--hold);font-weight:600}
.ok{margin:10px 16px;color:var(--done)}
.tiles{grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 28px}.tile{padding:12px;min-height:84px}.tile b{font-size:19px}.tile em{font-size:22px;font-family:TPD,"Arial Narrow",sans-serif;display:block;margin-top:6px}
#tab button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
#tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;min-height:0;padding:0;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:34px;line-height:1;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tbar,#mAdd{display:none}
details{margin-top:12px}summary{min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:up .22s ease-out}@keyframes up{from{transform:translateY(36px);opacity:0}}}
/* visual upgrade */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px 420px at 90% -5%,rgba(63,176,168,.24),transparent 70%),radial-gradient(520px 420px at -10% 105%,rgba(224,86,110,.18),transparent 70%)}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
header{border-bottom:1px solid rgba(255,255,255,.08);padding:12px 16px}header h1{font-size:23px}
.card,.rec,.tile,.att{border:1px solid rgba(255,255,255,.09);border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),var(--card);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.07)}
.card.hold,.rec.hold,.att{border-color:var(--hold);box-shadow:0 0 0 1px var(--hold),0 8px 24px rgba(0,0,0,.3)}

<dialog id="dHrs"><div class="dlg" id="hForm"></div></dialog>
<dialog id="dMod"><form method="dialog" class="dlg" id="mForm"></form></dialog>

<dialog id="dAdd"><form method="dialog" class="dlg" id="fAdd">
<h2>Add unit</h2>
<label>Unit name<input name="name" required placeholder="e.g. Unit 3"></label>
<label>Customer<input name="customer" value="Argon"></label>
<label>Project<select name="project"><option value="">Not set</option><option>Oxnard, CA: LM6000</option><option>Oman: GE 6B Units 1 & 2</option><option>Oman: GE 6B Units 3, 4 & 5</option></select></label>
<label>Serial number<input name="serial" placeholder="Nameplate serial"></label>
<label>Coming from<input name="src" placeholder="Plant or site name"></label>
<label>Going to (data center)<input name="dest" placeholder="Data center project"></label>
<label>Expected arrival<input name="eta" type="date"></label>
<div class="row"><button type="button" id="cAdd">Cancel</button><button class="pri" type="submit">Add unit</button></div>
</form></dialog>

<dialog id="dUnit"><div class="dlg" id="unitBody"></div></dialog>

<script>
const STAGES=[
{n:"Receiving",s:"Arrives on site",c:["Bill of lading checked against shipment","Damage inspection and photos taken","Nameplate and serial number recorded","Material receipt logged","Preservation condition checked"]},
{n:"Teardown",s:"Disassembly",c:["Safety plan and lockout reviewed","Disassembly sequence approved","Hardware tagged and bagged","Components inventoried","Initial findings recorded"]},
{n:"Inspection",s:"Measure and decide",c:["Hot gas path inspected","Rotor and bearing measurements taken","Non-destructive testing done","Findings report written","Repair or replace decisions made"]},
{n:"Overhaul",s:"Repair and rebuild",c:["Parts ordered and received","Repairs completed","Clearances set and recorded","Reassembly completed","Hold point signed off"]},
{n:"Test & Prep",s:"Ready for data center",c:["Final quality check passed","Controls and I/O checked","Data center spec requirements confirmed","Documentation packet complete","Preserved for transport"]},
{n:"Shipping",s:"Out the door",c:["Rigging and transport plan approved","Load-out inspection done","Shipping paperwork issued","Delivered and received by site"]}];
function ldate(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const KEY="turbine-tracker-v1";let U=[];
try{U=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){U=[]}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let WIPING=false;function save(){if(WIPING)return;try{localStorage.setItem(KEY,JSON.stringify(U))}catch(e){}}
function total(u){return STAGES.reduce((a,s)=>a+s.c.length,0)}
function doneCount(u){let n=0;STAGES.forEach((s,i)=>{if(u.stage>i)n+=s.c.length;else if(u.stage===i)n+=(u.checks[i]||[]).filter(Boolean).length});return n}
function pct(u){return u.done?100:Math.round(100*doneCount(u)/total(u))}
function log(u,t){u.log.unshift({t:new Date().toLocaleString(),m:t})}
let ps=0;
const card=u=>`<button class="card${u.hold?" hold":""}" data-id="${u.id}"><b>${esc(u.name)}</b><small>${esc(u.customer||"Argon")}, ${esc(u.serial||"No serial yet")}</small>${u.project?`<small>${esc(u.project)}</small>`:""}${u.dest?`<small>To: ${esc(u.dest)}</small>`:""}${u.hold?`<span class="tag">On hold: ${esc(u.hold)}</span>`:""}<div class="steps">${STAGES.map((x,i)=>`<i class="${u.done||i<u.stage?"d":i===u.stage?"c":""}"></i>`).join("")}</div><small>${u.done?"Delivered":STAGES[u.stage].n+", "+pct(u)+"% complete"}</small></button>`;
function render(){
 $("#stats").innerHTML=`<span><b>${U.length}</b>units</span><span><b>${U.filter(u=>u.hold&&!u.done).length}</b>on hold</span><span><b>${U.filter(u=>u.done).length}</b>delivered</span>`;
 const act=U.filter(u=>!u.done);
 const chips=STAGES.map((s,i)=>`<button class="chip${ps===i?" on":""}" data-s="${i}">${s.n}<b>${act.filter(u=>u.stage===i).length}</b></button>`).join("")+`<button class="chip${ps===9?" on":""}" data-s="9">Delivered<b>${U.length-act.length}</b></button>`;
 const list=ps===9?U.filter(u=>u.done):act.filter(u=>u.stage===ps);
 $("#board").innerHTML=`<div class="chips">${chips}</div><div class="cl">`+(list.map(card).join("")||`<div class="empty">No units in this stage. Tap Add unit to start.</div>`)+`</div>`;
}
const OVR=()=>DB.overrides||(DB.overrides=[]);
function stageBlock(u){const g=[],st=STAGES[u.stage],ch=(u.checks&&u.checks[u.stage])||[];
 if(st){const m=st.c.filter((c,i)=>!ch[i]);if(m.length)g.push(m.length+" checklist item(s) not checked: "+m.join("; "))}
 const ot=(DB.tasks||[]).filter(t=>t.unit===u.name&&t.st!=="Done");if(ot.length)g.push(ot.length+" task(s) not completed: "+ot.map(t=>t.title).join("; "));
 const oi=(DB.issues||[]).filter(i=>i.unit===u.name&&i.st!=="Resolved");if(oi.length)g.push(oi.length+" issue(s) not resolved: "+oi.map(i=>i.title).join("; "));
 const fo=(DB.fmea||[]).filter(x=>x.unit===u.name&&x.st==="Open");if(fo.length)g.push("FME area(s) still open, need a signed TP-FME-6 close out: "+fo.map(x=>x.loc).join("; "));
 if(u.hold)g.push("Unit is on hold: "+u.hold);return g}
function stageMove(u,reason,blk){const last=u.stage===STAGES.length-1,from=STAGES[u.stage].n,to=last?"Delivered":STAGES[u.stage+1].n;
 if(reason){OVR().push({id:"o"+Date.now().toString(36),unit:u.name,from,to,reason,by:ME?ME.title:"",at:new Date().toLocaleString(),date:ldate(),blk});log(u,"STAGE OVERRIDE by "+(ME?ME.title:"")+" ("+from+" to "+to+"). Reason: "+reason)}
 log(u,last?"Delivered":"Moved to "+to);if(last)u.done=true;else u.stage++;save();render();if(last)$("#dUnit").close();else openUnit(u.id)}
function stageOverride(u){const blk=stageBlock(u);if(!blk.length)return stageMove(u);
 pcGate("Stage Override","Enter your passcode. You will then be asked for the reason this unit is moving forward with open items.",()=>{const F=$("#dDatF");
  F.innerHTML=`<h2>Override Stage Gate</h2><div class="hint">${esc(u.name)}: ${esc(STAGES[u.stage].n)} to ${esc(u.stage===STAGES.length-1?"Delivered":STAGES[u.stage+1].n)}. This is recorded with your name, the date and the reason, and appears on the Shop Status report.</div><div class="rec hold"><b>Open items being bypassed</b>${blk.map(x=>`<small>&#9650; ${esc(x)}</small>`).join("")}</div><label>Reason for override (required)<textarea name="why" rows="4" placeholder="Why can this unit move forward now? Who approved it?"></textarea></label><div class="row"><button type="button" id="dX">Cancel</button><button type="button" class="pri" id="dS">Record and Move Forward</button></div>`;F.onchange=F.oninput=null;
  F.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="dX")return $("#dDat").close();if(b.id!=="dS")return;const w=F.elements.why.value.trim();if(w.length<10)return alert("Enter the reason (at least a short sentence).");$("#dDat").close();stageMove(u,w,blk)};
  $("#dDat").showModal();setTimeout(()=>F.elements.why.focus(),50)})}
function openUnit(id){
 const u=U.find(x=>x.id===id);if(!u)return;
 const st=STAGES[u.stage]||STAGES[5];const ch=u.checks[u.stage]=u.checks[u.stage]||st.c.map(()=>false);
 const blk=stageBlock(u),all=!blk.length;const last=u.stage===STAGES.length-1;
 $("#unitBody").innerHTML=`<h2>${esc(u.name)}</h2>
 <div class="hint">${esc(u.customer||"Argon")}${u.project?" &middot; "+esc(u.project):""} &middot; ${esc(u.serial||"No serial")} &middot; From ${esc(u.src||"unknown")} &middot; To ${esc(u.dest||"not set")}${u.eta?" &middot; Arrives "+esc(u.eta):""}</div>
 <div class="steps">${STAGES.map((s,i)=>`<i class="${u.done||i<u.stage?"d":i===u.stage?"c":""}" title="${s.n}"></i>`).join("")}</div>
 ${u.done?`<p><b>Delivered.</b> All stages complete.</p>`:`<h3>${st.n}: ${pct(u)}% overall</h3>
 ${st.c.map((t,i)=>`<label class="chk${ch[i]?" on":""}" style="margin:0;color:inherit;font-size:15px"><input type="checkbox" data-i="${i}" ${ch[i]?"checked":""}><span>${esc(t)}</span></label>`).join("")}
 <label>${u.hold?"Hold reason (clear to release)":"Put on hold (type the reason)"}<input id="hold" value="${esc(u.hold)}" placeholder="e.g. Waiting on rotor NDE report"></label>
 <div class="row"><button class="pri" id="adv" ${all?"":"disabled"}>${last?"Mark delivered":"Move to "+STAGES[u.stage+1].n}</button>${all?"":`<button id="ovr">Override with Reason</button>`}${u.stage>0?`<button id="back">Move back</button>`:""}</div>
 ${all?"":`<div class="rec hold"><b>Stage gate: close these out before moving forward</b>${blk.map(x=>`<small>&#9650; ${esc(x)}</small>`).join("")}<small>Only a supervisor can override, with a passcode and a written reason.</small></div>`}`}
 <label>Add a note<textarea id="note" rows="2"></textarea></label>
 <div class="row"><button id="addNote">Save note</button></div>
 <div class="log">${u.log.map(l=>`<div>${esc(l.t)}: ${esc(l.m)}</div>`).join("")}</div>
 <div class="row"><button id="close">Close</button><button id="del" class="danger">Delete unit</button></div>`;
 const d=$("#dUnit");if(!d.open)d.showModal();
 const rr=()=>{save();render();openUnit(id)};
 $("#unitBody").querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{const i=+c.dataset.i;ch[i]=c.checked;log(u,(c.checked?"Checked: ":"Unchecked: ")+st.c[i]);rr()});
 const h=$("#hold");if(h)h.onchange=()=>{u.hold=h.value.trim();log(u,u.hold?"Put on hold: "+u.hold:"Hold released");rr()};
 const a=$("#adv");if(a)a.onclick=()=>{if(stageBlock(u).length)return alert("This stage is not closed out. Finish the open items or use Override with Reason.");stageMove(u)};const ov=$("#ovr");if(ov)ov.onclick=()=>stageOverride(u);
 const b=$("#back");if(b)b.onclick=()=>{u.stage--;log(u,"Moved back to "+STAGES[u.stage].n);rr()};
 $("#addNote").onclick=()=>{const v=$("#note").value.trim();if(!v)return;log(u,v);rr()};
 $("#close").onclick=()=>d.close();if(!isSup()){["#del","#adv","#back","#ovr"].forEach(q=>{const e=$(q);if(e)e.hidden=true});const hh=$("#hold");if(hh)hh.disabled=true}
 $("#del").onclick=()=>{if(confirm("Delete "+u.name+"? This cannot be undone.")){U=U.filter(x=>x!==u);save();render();d.close()}};
}
$("#board").onclick=e=>{const h=e.target.closest(".chip");if(h){ps=+h.dataset.s;render();return}const c=e.target.closest(".card");if(c)openUnit(c.dataset.id)};
$("#add").onclick=()=>$("#dAdd").showModal();
$("#cAdd").onclick=()=>$("#dAdd").close();
$("#fAdd").onsubmit=e=>{const f=new FormData(e.target);const u={id:"u"+Date.now(),name:f.get("name").trim(),customer:(f.get("customer")||"").trim()||"Argon",project:f.get("project")||"",serial:f.get("serial").trim(),src:f.get("src").trim(),dest:f.get("dest").trim(),eta:f.get("eta"),stage:0,checks:{},hold:"",done:false,log:[]};log(u,"Unit added");U.push(u);ps=0;save();render();e.target.reset()};
const b64e=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)},b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function bkKey(pw,salt){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function bkEnc(text,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await bkKey(pw,salt),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(text)));return JSON.stringify({tp:"turbinepros-backup",v:2,kdf:"PBKDF2-SHA256-250000",salt:b64e(salt),iv:b64e(iv),data:b64e(ct)})}
async function bkDec(o,pw){const k=await bkKey(pw,b64d(o.salt));return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(o.iv)},k,b64d(o.data)))}
function bkDownload(text){const b=new Blob([text],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="turbinepros-backup-"+ldate()+".json";document.body.appendChild(a);a.click();a.remove()}
function bkExport(){const text=JSON.stringify(Object.assign({turbines:U},DB)),F=$("#dDatF");
 if(!(window.crypto&&crypto.subtle)){if(confirm("This browser cannot encrypt the file. Export it unencrypted? It is still gated by your sign-in passcode."))bkDownload(text);return}
 F.innerHTML=`<h2>Backup Passcode</h2><div class="hint">The backup file is encrypted with this passcode. You will need it to import the file. If it is lost the backup cannot be opened. Use at least 6 characters.</div><label>Backup Passcode<input name="p1" type="password" autocomplete="new-password"></label><label>Type It Again<input name="p2" type="password" autocomplete="new-password"></label><div class="row"><button type="button" id="dX">Cancel</button><button type="button" class="pri" id="dS">Encrypt and Export</button></div>`;F.onchange=F.oninput=null;
 F.onclick=async e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="dX")return $("#dDat").close();if(b.id!=="dS")return;const p=F.elements.p1.value;if(p.length<6)return alert("Use at least 6 characters.");if(p!==F.elements.p2.value)return alert("The two passcodes do not match.");
  b.disabled=true;try{bkDownload(await bkEnc(text,p));$("#dDat").close()}catch(x){alert("Could not encrypt the backup.");b.disabled=false}};$("#dDat").showModal();setTimeout(()=>F.elements.p1.focus(),50)}
let bkTry=0,bkLock=0;
function bkApply(text){try{const d=JSON.parse(text);if(!Array.isArray(d.turbines))throw 0;if(!confirm("Replace all data in this app with the backup file?"))return;U=d.turbines;DB=Object.assign({tasks:[],people:[],safety:[],fme:[],data:[],costs:[],time:[],dsr_comp:[],dsr_tech:[],dsr_track:[],dsr_push:[],dsr_data:[],dsr_ewa:[],dsr_hseq:[],dsr_vend:[],dsrs:{}},d);delete DB.turbines;save();sv();show("home")}catch(x){alert("That file is not a TurbinePros backup.")}}
function bkOpen(text){let o=null;try{o=JSON.parse(text)}catch(x){}
 if(!o||o.tp!=="turbinepros-backup")return bkApply(text);
 if(!(window.crypto&&crypto.subtle))return alert("This browser cannot decrypt the backup.");
 const F=$("#dDatF");F.innerHTML=`<h2>Backup Passcode</h2><div class="hint">This backup is encrypted. Enter the passcode that was set when it was exported.</div><label>Backup Passcode<input name="p" type="password" autocomplete="off"></label><div class="row"><button type="button" id="dX">Cancel</button><button type="button" class="pri" id="dS">Decrypt and Import</button></div>`;F.onchange=F.oninput=null;
 F.onclick=async e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="dX")return $("#dDat").close();if(b.id!=="dS")return;if(Date.now()<bkLock)return alert("Too many wrong passcodes. Wait 30 seconds and try again.");
  let t;try{t=await bkDec(o,F.elements.p.value)}catch(x){if(++bkTry>=5){bkLock=Date.now()+3e4;bkTry=0;$("#dDat").close();return alert("Too many wrong passcodes. Import is locked for 30 seconds.")}F.elements.p.value="";return alert("Wrong backup passcode.")}
  bkTry=0;$("#dDat").close();bkApply(t)};$("#dDat").showModal();setTimeout(()=>F.elements.p.focus(),50)}
$("#exp").onclick=()=>pcGate("Export Backup","The backup contains all unit, crew and customer data. Enter your 4-digit sign-in passcode to continue.",()=>{$("#dMore").open&&$("#dMore").close();bkExport()});
let IMPOK=false,pcTry=0,pcLock=0;
function pcGate(title,msg,ok){if(!isSup()||!ME)return alert("Only a supervisor can use backups.");if(Date.now()<pcLock)return alert("Too many wrong passcodes. Wait 30 seconds and try again.");
 const F=$("#dDatF");F.innerHTML=`<h2>${title}</h2><div class="hint">${msg}</div><label>Your Passcode<input name="pc" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><div class="row"><button type="button" id="dX">Cancel</button><button type="button" class="pri" id="dS">Continue</button></div>`;F.onchange=F.oninput=null;
 F.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="dX")return $("#dDat").close();if(b.id!=="dS")return;
  if(Date.now()<pcLock)return alert("Too many wrong passcodes. Wait 30 seconds and try again.");
  if(String(ME.pin)!==F.elements.pc.value.trim()){if(++pcTry>=5){pcLock=Date.now()+3e4;pcTry=0;$("#dDat").close();return alert("Too many wrong passcodes. Backups are locked for 30 seconds.")}F.elements.pc.value="";return alert("Wrong passcode.")}
  pcTry=0;$("#dDat").close();ok()};
 $("#dDat").showModal();setTimeout(()=>F.elements.pc.focus(),50)}
$("#imp").onclick=()=>pcGate("Import Backup","Importing replaces ALL data in this app. Enter your 4-digit passcode to continue.",()=>{IMPOK=true;$("#dMore").open&&$("#dMore").close();$("#impF").click()});
$("#impF").onchange=e=>{const fl=e.target.files[0];e.target.value="";if(!IMPOK||!isSup())return alert("Enter your passcode first.");IMPOK=false;if(!fl)return;const r=new FileReader();r.onload=()=>bkOpen(r.result);r.readAsText(fl)};

function hrPrint(){const E=RFILT(),ds_=[...new Set(E.map(h=>h.date))].sort(),ppl=[...new Set(E.map(h=>h.who))].sort(),role=n=>{const p=DB.people.find(x=>x.title===n);return p?p.role:""},now=new Date().toLocaleString(),

 const shareBlob=async(blob,name)=>{try{const F=P("Filesystem"),S=P("Share");if(!F||!S)return alert("Saving files needs the Filesystem and Share plugins. Run npx cap sync ios and rebuild.");
